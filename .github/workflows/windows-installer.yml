# Builds the Windows installer (Ojas-Setup-<version>.exe) on GitHub's Windows machines and
# keeps it as a downloadable artifact on the run's page. The installer is not code-signed yet.
name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the server
        run: npm test -w @ojas/server

      - name: Build the installer
        run: npm run dist -w @ojas/desktop -- --publish never

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Ojas-Setup
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
